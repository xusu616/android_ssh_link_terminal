// Release-only version auto-increment (aligned with shizuku-ftp)
def versionPropsFile = file('version.properties')
def versionProps = new Properties()

if (versionPropsFile.canRead()) {
    versionProps.load(new FileInputStream(versionPropsFile))
} else {
    throw new GradleException("Could not read version.properties!")
}

def versionTaskGraph = gradle.taskGraph
def releaseBuildTask = ~/^(assemble|bundle|package|install|publish)Release(Bundle|Apk)?$/
def versionLock = new Object()
def nextVersion = null
def versionPersisted = false

def isReleaseBuild = {
    try {
        return versionTaskGraph.allTasks.any { releaseBuildTask.matcher(it.name).matches() }
    } catch (Exception ignored) {
        return false
    }
}

def bumpPatch = { String name ->
    def parts = name?.trim()?.split('\\.')
    if (parts == null || parts.length < 3 || !(parts[-1] ==~ /\d+/)) {
        return name
    }
    parts[parts.length - 1] = (parts[-1].toInteger() + 1).toString()
    return parts.join('.')
}

def resolveVersion = {
    synchronized (versionLock) {
        if (nextVersion == null) {
            nextVersion = [
                code: versionProps['VERSION_CODE'].toInteger() + 1,
                name: bumpPatch(versionProps['VERSION_NAME'])
            ]
        }
        if (!versionPersisted && isReleaseBuild()) {
            versionPersisted = true
            versionProps['VERSION_CODE'] = nextVersion['code'].toString()
            versionProps['VERSION_NAME'] = nextVersion['name']
            versionProps.store(versionPropsFile.newWriter(), null)
        }
        return nextVersion
    }
}

def localPropsFile = rootProject.file('local.properties')
def localProps = new Properties()
if (localPropsFile.canRead()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStoreFilePath = (localProps.getProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE'))?.trim()
def releaseStorePassword = (localProps.getProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD'))?.trim()
def releaseKeyAlias = (localProps.getProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS'))?.trim()
def releaseKeyPassword = (localProps.getProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD'))?.trim()
def hasReleaseSigning = releaseStoreFilePath && file(releaseStoreFilePath).isFile() &&
    releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.xusu.sshlinkterminal"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "com.xusu.sshlinkterminal"
        versionCode = versionProps['VERSION_CODE'].toInteger()
        versionName = versionProps['VERSION_NAME']

        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
            shrinkResources = false
            applicationIdSuffix = ".debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
        aidl = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/BCKEY.SF',
                'META-INF/BCKEY.DSA',
                'META-INF/BCKEY.RSA'
            ]
        }
    }

    lint {
        abortOnError = false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.forEach { output ->
            output.versionCode.set(providers.provider { resolveVersion()['code'] })
            output.versionName.set(providers.provider { resolveVersion()['name'] })
        }
    }
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("ssh-link-terminal-${variant.buildType}.apk")
        }
    }
}

